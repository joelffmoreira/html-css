<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="registo.php" method="POST" autocomplete="on">
            <p>
                <label for="iuti">Utilizador: </label>
                <input type="text" name="uti" id="iuti" required minlength="5" maxlength="15" size="20" placeholder="Nome do utilizador" autocomplete="username">
            </p>
            <p>
                <label for="ipass">Password: </label>
                <input type="password" name="pass" id="ipass" required minlength="8" maxlength="20" size="8" autocomplete="current-password">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
    </form>
</body>
</html>
